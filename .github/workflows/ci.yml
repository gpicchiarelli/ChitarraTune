name: CI

# Runner image. `xcode-27` is GitHub's preview image and the only one carrying Xcode 27, which the
# SDK 27 deployment target needs; the GA `macos-26` image tops out at Xcode 26.6. Move every
# `runs-on: xcode-27` in this repository to `macos-27` as soon as it exists: a preview image can
# change or be withdrawn without notice. The same note governs codeql.yml and release.yml; it is
# written here once rather than above each job, so the day it stops being true there is one place
# to fix and not nine.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only ever reads the repository.
permissions:
  contents: read

# On a branch or a pull request a newer push supersedes the run in progress. On `main` it does
# not: every commit that lands keeps a complete verification of its own, so a burst of pushes
# cannot leave a commit on the default branch whose longest checks were dropped half-way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Nothing here caches between runs, on purpose. A cache on a public repository is writable from a
# fork's pull request, which turns the build into something an outsider can influence; the gate is
# worth more cold than fast (ADR 0010). Reuse belongs on the machine of whoever is working, where
# it is nobody else's to poison — see ADR 0017 and Scripts/verify.sh.

jobs:
  # The scripts and the workflows are the development process, and they used to be the only code
  # here that nothing checked: `ci.yml` even carried two `# shellcheck disable=` directives for a
  # linter that never ran. actionlint would have caught the `continue-on-error` expression that made
  # the Mac job stop the gate it was documented as unable to stop (ADR 0019).
  #
  # Both tools are downloaded at a pinned version and refused unless their SHA-256 matches, the way
  # every action here is pinned to a commit: a linter runs with the runner's full permissions, so it
  # is supply chain like any other (ADR 0010). Linux, so it is minutes of nobody's machine.
  lint:
    name: Shell and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Pinned linters, checksum-verified
        env:
          ACTIONLINT_SHA: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_SHA: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/linters"
          cd "$RUNNER_TEMP/linters"
          curl -fsSL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSL -o shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "$ACTIONLINT_SHA  actionlint.tar.gz" | sha256sum --check --strict
          echo "$SHELLCHECK_SHA  shellcheck.tar.xz" | sha256sum --check --strict
          tar xzf actionlint.tar.gz actionlint
          tar xJf shellcheck.tar.xz --strip-components=1 shellcheck-v0.11.0/shellcheck
          echo "$RUNNER_TEMP/linters" >> "$GITHUB_PATH"
      - name: Versions
        run: |
          actionlint --version | head -n 1
          shellcheck --version | sed -n '2p'
      # actionlint runs shellcheck over every `run:` block itself, so the two steps together cover
      # all of the shell in this repository.
      - name: Workflows
        run: actionlint -color
      - name: Scripts
        run: shellcheck -x --severity=warning Scripts/*.sh Scripts/lib/*.sh .githooks/pre-push

  # The iOS device slice: the only build in this file that nothing else already produces. macOS
  # Debug comes from `mac`, macOS Release from `release`, the iOS Simulator from `ui-ios`.
  app:
    name: App · iOS Release (arm64e)
    runs-on: xcode-27
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: xcodebuild -version
      - name: Build without warnings, exactly as a release
        run: |
          set -euo pipefail
          xcodebuild \
            -project ChitarraTune.xcodeproj \
            -scheme ChitarraTune \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            GIT_COMMIT="$(git rev-parse --short HEAD)" \
            ENABLE_POINTER_AUTHENTICATION=YES \
            build
      - name: Shipping binaries carry pointer authentication
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r binary; do
            found=1
            echo "$binary: $(lipo -archs "$binary")"
            lipo -archs "$binary" | grep -qw arm64e || { echo "::error::$binary is not arm64e"; exit 1; }
          done < <(find build/Build/Products -type f -perm -u+x \( -name ChitarraTune -o -name ChitarraTuneControls \) -not -path '*dSYM*')
          [ "$found" = 1 ] || { echo "::error::no app binary found"; exit 1; }

  kit:
    name: Kit tests and coverage
    runs-on: xcode-27
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      # One tree for both steps, named (ADR 0017 rule 5). Unnamed, `swift build` writes into the
      # working tree and `coverage-gate.sh` writes into the cache, so the package was compiled twice
      # per run — and the in-tree copy was what left 211 MB under ~/Documents on a real machine.
      - name: Build without warnings
        env:
          SCRATCH: ${{ runner.temp }}/kit-build
        run: |
          swift build --package-path Packages/ChitarraTuneKit --scratch-path "$SCRATCH" --build-tests \
            -c release -Xswiftc -enable-testing -Xswiftc -warnings-as-errors
      - name: Test, with the coverage gate
        env:
          SCRATCH: ${{ runner.temp }}/kit-build
        run: Scripts/coverage-gate.sh

  # The realistic-signal accuracy matrix in full (every tuning × string × detuning × scenario). Too
  # slow for a debug build on every push, fast in an optimised one.
  dsp:
    name: DSP accuracy (full matrix)
    runs-on: xcode-27
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Realistic signals, recorded corpus and real-time budgets, optimised build
        env:
          CHITARRA_FULL_DSP: "1"
        run: |
          swift test --package-path Packages/ChitarraTuneKit --scratch-path "$RUNNER_TEMP/dsp-build" \
            -c release -Xswiftc -enable-testing \
            --filter "RealisticSignalTests|RecordingCorpusTests|RealTimeBudgetTests|PitchDetectorTests"

  # The Mac app built exactly as a release and checked the way notarization and App Review would
  # (bundle, architectures, linked libraries, entitlements, no debug entitlement, symbols), plus the
  # disk image it ships in (Apple's layout, ad hoc: no certificate needed), on every push, so that
  # release day holds no surprise (ADR 0013, ADR 0014). This is also the macOS Release build check:
  # same configuration, same flags, and more assertions than a bare `xcodebuild` job would make.
  release:
    name: Release readiness · macOS (app and disk image)
    runs-on: xcode-27
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Release build and notarization checks
        env:
          SCRATCH: ${{ runner.temp }}
          # The next step builds the disk image from this app, so the build outlives the check;
          # the runner is thrown away a minute later (ADR 0017 rule 3).
          KEEP_BUILD: "1"
        run: Scripts/release-check.sh
      - name: Disk image, built and verified as the release does
        env:
          SCRATCH: ${{ runner.temp }}
        run: Scripts/make-dmg.sh

  # End-to-end tests in demo mode (synthetic guitar, no microphone), including Xcode's accessibility
  # audit of every screen in light, dark, landscape and the largest text size.
  #
  # Compiling for the simulator and running on a device are separate steps: a compile error is worth
  # knowing before a simulator boots, and the generic destination is the SDK check that no other job
  # in this file now makes.
  ui-ios:
    name: UI · ${{ matrix.name }}
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # A family, never a model: Apple renames them every year (`iPhone 17 Pro` exists on the
          # Xcode 26 image and does not on the Xcode 27 one), and a job that names one breaks on an
          # image update for no reason. The step below takes whichever device of the family is there.
          # ChitarraTuneTests is the app's own unit-test bundle. It is the same code, the same OS
          # and the same architecture on both devices, and one of its tests reads the log store for
          # fifteen seconds, so it is gated once — on iPhone — rather than three times.
          - name: iPhone
            family: iPhone
            prefer: ""
            bundles: ""
          # The picker took whichever iPad was newest, which is the heaviest one on the image:
          # iPad Pro 13-inch (M5), 381 s of test bodies against the iPhone's 276 s and about 700 s
          # of simulator overhead against 278 s. Every iPad is regular/regular in full screen, so a
          # smaller one exercises the same layout — and a smaller screen is a stricter check for the
          # clipping the accessibility audit looks for at the largest text size, not a weaker one.
          # This is a preference and not a model: if none of these is on the image, any iPad does.
          - name: iPad
            family: iPad
            prefer: "iPad mini,iPad Air 11,iPad Pro 11,iPad Air"
            bundles: "-only-testing:ChitarraTuneUITests"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available
      - name: Pick a simulator of the family
        env:
          FAMILY: ${{ matrix.family }}
          PREFER: ${{ matrix.prefer }}
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | python3 -c "
          import json, os, sys
          family = os.environ['FAMILY']
          prefer = [p for p in os.environ.get('PREFER', '').split(',') if p]
          runtimes = json.load(sys.stdin)['devices']
          def rank(name):
              # Lower is better: the first preference that matches, or last place for the rest.
              for index, wanted in enumerate(prefer):
                  if name.startswith(wanted):
                      return index
              return len(prefer)
          best = ()
          for runtime, devices in runtimes.items():
              if 'SimRuntime.iOS-' not in runtime:
                  continue
              version = [int(p) for p in runtime.rsplit('iOS-', 1)[1].split('-') if p.isdigit()]
              for device in devices:
                  name = device['name']
                  if not name.startswith(family):
                      continue
                  # The newest runtime first — the deployment target is 27.0, and an older
                  # runtime cannot install the app at all — and only then the lighter device.
                  key = ([-v for v in version], rank(name))
                  if not best or key < best[0]:
                      best = (key, device['udid'], name)
          if not best:
              sys.exit(f'no available {family} simulator')
          print(best[1], best[2], sep='\t')
          ")"
          echo "Using ${udid#*$'\t'}"
          echo "DESTINATION=platform=iOS Simulator,id=${udid%%$'\t'*}" >> "$GITHUB_ENV"
      - name: Build the app and its tests for the simulator SDK
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project ChitarraTune.xcodeproj \
            -scheme ChitarraTune \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO
      # Serial, and measured: `-parallel-testing-enabled YES` with two workers was tried here and
      # made the job SLOWER — iPhone went from 854 s to 936 s, of which the tests alone were 867 s.
      # XCUITest distributes work by test CLASS, and all 18 tests live in one
      # (`ChitarraTuneUITests`; `AppStoreScreenshots` is skipped unless Scripts/screenshots.sh runs
      # it). One class over two workers is no concurrency at all, and a second cloned simulator is
      # booted for nothing. Splitting the class is what would have to come first — until somebody
      # does that and measures it, this stays serial.
      - name: UI tests
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: |
          set -euo pipefail
          # BUNDLES is a fixed -only-testing flag from the matrix, or empty. The value is ours and
          # not an input, and it has to become argv words, so the splitting is intended.
          # shellcheck disable=SC2086
          xcodebuild test-without-building \
            -project ChitarraTune.xcodeproj \
            -scheme ChitarraTune \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            $BUNDLES \
            -skip-testing:ChitarraTuneUITests/ChitarraTuneUITests/testLaunchPerformance \
            -skip-testing:ChitarraTuneUITests/AppStoreScreenshots \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      # What each test cost, on the run itself. The UI jobs are the longest thing in the gate, so
      # this is where a regression has to be visible without anybody going to look for it (ADR 0020).
      - name: What each test cost
        if: always()
        run: |
          set -euo pipefail
          # No bundle means the tests never started, which the step above has already said.
          [ -d "$RUNNER_TEMP/ui.xcresult" ] || { echo "no result bundle: the tests did not run"; exit 0; }
          Scripts/test-timings.sh "$RUNNER_TEMP/ui.xcresult" --all
      - name: Keep the result bundle when a test fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-${{ matrix.name }}
          path: ${{ runner.temp }}/ui.xcresult
          retention-days: 7

  # The Mac on every push: the Debug build, which is this repository's macOS compile check, and the
  # app's own unit tests, which pass. Both block the gate.
  #
  # The Mac *screens* are not here. They cannot pass on any image GitHub offers — a macOS 27 minimum
  # means the app will not launch on the GA macos-26 image, and the xcode-27 preview's virtual GPU
  # has no shader slice for SwiftUI's renderer ("unable to find air64_v27 slice", RenderBox), so the
  # window never draws and every wait times out — and a check that cannot fail the gate must not run
  # on every push (ADR 0021 rule 4). They run weekly in mac-screens.yml. The evidence that they were
  # failing all along, while this job reported success, is that the artifact uploaded only on failure
  # was there on every run: 78 MB, 78 MB, 139 MB.
  mac:
    name: Mac · build and unit tests
    runs-on: xcode-27
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: xcodebuild -version
      # The macOS test runner must be signed; an ad-hoc signature is enough on the runner.
      - name: Build the Mac app and its tests (Debug)
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project ChitarraTune.xcodeproj \
            -scheme ChitarraTune \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
      - name: The app's own unit tests
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project ChitarraTune.xcodeproj \
            -scheme ChitarraTune \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -only-testing:ChitarraTuneTests \
            -resultBundlePath "$RUNNER_TEMP/unit.xcresult" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
      - name: What each test cost
        if: always()
        run: |
          set -euo pipefail
          [ -d "$RUNNER_TEMP/unit.xcresult" ] || { echo "no result bundle: the tests did not run"; exit 0; }
          Scripts/test-timings.sh "$RUNNER_TEMP/unit.xcresult" --all
      - name: Keep the result bundle when a test fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mac-unit
          path: ${{ runner.temp }}/unit.xcresult
          retention-days: 7

  # One check that stands for all of the above, so the result of the whole run is a single line on
  # the commit. Add every new job to `needs` below.
  gate:
    name: Gate
    if: always()
    needs: [lint, kit, app, dsp, release, ui-ios, mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Reading this run's own job durations, and nothing else.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Every required job must have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job finished with '$result'"
              exit 1
            fi
          done
      # What the gate cost, beside what it is expected to cost. A run that makes the gate slower
      # says so on itself; nobody has to go and reconstruct it afterwards (ADR 0020). It warns and
      # never fails: these runners are too variable for a timing to be a verdict.
      - name: What the gate cost
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '.jobs[] | select(.completed_at != null) | [.name, .conclusion, .started_at, .completed_at] | @tsv' \
            > jobs.tsv
          python3 - jobs.tsv .github/ci-baseline.json <<'PY'
          import datetime, json, os, sys

          def when(text):
              return datetime.datetime.fromisoformat(text.replace("Z", "+00:00"))

          baseline = json.load(open(sys.argv[2]))
          expected, tolerance = baseline["jobs"], baseline["tolerance"]

          rows, total, warnings = [], 0.0, []
          for line in open(sys.argv[1]):
              name, conclusion, started, completed = line.rstrip("\n").split("\t")
              seconds = (when(completed) - when(started)).total_seconds()
              total += seconds
              budget = expected.get(name)
              if budget is None:
                  mark, note = "❓", "unbaselined"
                  warnings.append(f"{name} has no entry in .github/ci-baseline.json ({seconds:.0f}s)")
              elif seconds > budget * tolerance:
                  mark, note = "⚠️", f"{seconds / budget:.2f}× of {budget}s"
                  warnings.append(f"{name} took {seconds:.0f}s, {seconds / budget:.2f}× its {budget}s baseline")
              else:
                  mark, note = "✅", f"{budget}s"
              rows.append(f"| {name} | {seconds:.0f} | {note} | {conclusion} | {mark} |")

          report = "\n".join(
              [f"Runner time for this run: **{total / 60:.1f} minutes** across {len(rows)} jobs.", "",
               "| Job | Seconds | Baseline | Result | |", "| --- | ---: | ---: | --- | :---: |"] + rows)
          print(report)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as handle:
                  handle.write("### What the gate cost\n" + report + "\n")
          for warning in warnings:
              print(f"::warning::{warning}")
          PY
