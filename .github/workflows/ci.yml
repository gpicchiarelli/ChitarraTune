name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only ever reads the repository.
permissions:
  contents: read

# A newer push to the same ref supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    name: Kit tests and coverage
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build without warnings
        run: swift build --package-path Packages/ChitarraTuneKit -Xswiftc -warnings-as-errors
      - name: Test, with the coverage gate
        run: Scripts/coverage-gate.sh

  app:
    name: App · ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Debug
            configuration: Debug
            destination: platform=macOS
          - name: macOS Release
            configuration: Release
            destination: platform=macOS
          - name: iOS Simulator
            configuration: Debug
            destination: generic/platform=iOS Simulator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: xcodebuild -version
      - name: Build without warnings
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          DESTINATION: ${{ matrix.destination }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project ChitarraTune.xcodeproj \
            -scheme ChitarraTune \
            -configuration "$CONFIGURATION" \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            GIT_COMMIT="$(git rev-parse --short HEAD)" \
            build

  # One check that stands for all of the above, so the result of the whole run is a single line on
  # the commit. Add every new job to `needs` below.
  gate:
    name: Gate
    if: always()
    needs: [kit, app]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job must have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job finished with '$result'"
              exit 1
            fi
          done
