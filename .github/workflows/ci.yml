name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'
      - name: Generate VersionInfo.swift from Git
        run: |
          set -euo pipefail
          OUT="Apps/Shared/Generated/VersionInfo.swift"
          TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo)"
          SHA="$(git rev-parse --short HEAD 2>/dev/null || echo)"
          DESC="$(git describe --tags --dirty --always 2>/dev/null || git rev-parse --short HEAD 2>/dev/null || echo)"
          sed -i.bak "s/public static let gitTag: String = \".*\"/public static let gitTag: String = \"${TAG}\"/" "$OUT"
          sed -i.bak "s/public static let gitCommit: String = \".*\"/public static let gitCommit: String = \"${SHA}\"/" "$OUT"
          sed -i.bak "s/public static let gitDescribe: String = \".*\"/public static let gitDescribe: String = \"${DESC}\"/" "$OUT"
          rm -f "${OUT}.bak"
      - name: Build (Debug)
        run: |
          set -euo pipefail
          xcodebuild -project ChitarraTune.xcodeproj -scheme "ChitarraTune" -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Unit Tests
        run: |
          set -euo pipefail
          xcodebuild -project ChitarraTune.xcodeproj -scheme "ChitarraTune" -destination 'platform=macOS' -configuration Debug -only-testing:ChitarraTuneTests CODE_SIGNING_ALLOWED=NO test
      - name: UI Tests (Xcode)
        run: |
          set -euo pipefail
          xcodebuild -project ChitarraTune.xcodeproj -scheme "ChitarraTune" -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test
      - name: Build iOS (Debug)
        run: |
          set -euo pipefail
          xcodebuild -project ChitarraTune.xcodeproj -scheme "ChitarraTune iOS" -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build (Release)
        run: |
          set -euo pipefail
          xcodebuild -project ChitarraTune.xcodeproj -scheme "ChitarraTune" -configuration Release -destination 'platform=macOS' build
