name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only ever reads the repository.
permissions:
  contents: read

# A newer push to the same ref supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    name: Kit tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test ChitarraTuneKit
        run: swift test --package-path Packages/ChitarraTuneKit

  app:
    name: App · ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Debug
            configuration: Debug
            destination: platform=macOS
          - name: macOS Release
            configuration: Release
            destination: platform=macOS
          - name: iOS Simulator
            configuration: Debug
            destination: generic/platform=iOS Simulator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: xcodebuild -version
      - name: Build
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          DESTINATION: ${{ matrix.destination }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project ChitarraTune.xcodeproj \
            -scheme ChitarraTune \
            -configuration "$CONFIGURATION" \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO \
            GIT_COMMIT="$(git rev-parse --short HEAD)" \
            build
