name: CI

# Runner image. `xcode-27` is GitHub's preview image and the only one carrying Xcode 27, which the
# SDK 27 deployment target needs; the GA `macos-26` image tops out at Xcode 26.6. Move every
# `runs-on: xcode-27` in this repository to `macos-27` as soon as it exists: a preview image can
# change or be withdrawn without notice. The same note governs codeql.yml and release.yml; it is
# written here once rather than above each job, so the day it stops being true there is one place
# to fix and not nine.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only ever reads the repository.
permissions:
  contents: read

# On a branch or a pull request a newer push supersedes the run in progress. On `main` it does
# not: every commit that lands keeps a complete verification of its own, so a burst of pushes
# cannot leave a commit on the default branch whose longest checks were dropped half-way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Nothing here caches between runs, on purpose. A cache on a public repository is writable from a
# fork's pull request, which turns the build into something an outsider can influence; the gate is
# worth more cold than fast (ADR 0010). Reuse belongs on the machine of whoever is working, where
# it is nobody else's to poison — see ADR 0017 and Scripts/verify.sh.

jobs:
  # The scripts and the workflows are the development process, and they used to be the only code
  # here that nothing checked: `ci.yml` even carried two `# shellcheck disable=` directives for a
  # linter that never ran. actionlint would have caught the `continue-on-error` expression that made
  # the Mac job stop the gate it was documented as unable to stop (ADR 0019).
  #
  # Both tools are downloaded at a pinned version and refused unless their SHA-256 matches, the way
  # every action here is pinned to a commit: a linter runs with the runner's full permissions, so it
  # is supply chain like any other (ADR 0010). Linux, so it is minutes of nobody's machine.
  lint:
    name: Shell and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Pinned linters, checksum-verified
        env:
          ACTIONLINT_SHA: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_SHA: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/linters"
          cd "$RUNNER_TEMP/linters"
          curl -fsSL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSL -o shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "$ACTIONLINT_SHA  actionlint.tar.gz" | sha256sum --check --strict
          echo "$SHELLCHECK_SHA  shellcheck.tar.xz" | sha256sum --check --strict
          tar xzf actionlint.tar.gz actionlint
          tar xJf shellcheck.tar.xz --strip-components=1 shellcheck-v0.11.0/shellcheck
          echo "$RUNNER_TEMP/linters" >> "$GITHUB_PATH"
      - name: Versions
        run: |
          actionlint --version | head -n 1
          shellcheck --version | sed -n '2p'
      # actionlint runs shellcheck over every `run:` block itself, so the two steps together cover
      # all of the shell in this repository.
      - name: Workflows
        run: actionlint -color
      - name: Scripts
        run: shellcheck -x --severity=warning Scripts/*.sh Scripts/lib/*.sh .githooks/pre-push

  # The iOS device slice: the only build in this file that nothing else already produces. macOS
  # Debug comes from `ui-mac`, macOS Release from `release`, the iOS Simulator from `ui-ios`.
  app:
    name: App · iOS Release (arm64e)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: xcodebuild -version
      - name: Build without warnings, exactly as a release
        run: |
          set -euo pipefail
          xcodebuild \
            -project ChitarraTune.xcodeproj \
            -scheme ChitarraTune \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            GIT_COMMIT="$(git rev-parse --short HEAD)" \
            ENABLE_POINTER_AUTHENTICATION=YES \
            build
      - name: Shipping binaries carry pointer authentication
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r binary; do
            found=1
            echo "$binary: $(lipo -archs "$binary")"
            lipo -archs "$binary" | grep -qw arm64e || { echo "::error::$binary is not arm64e"; exit 1; }
          done < <(find build/Build/Products -type f -perm -u+x \( -name ChitarraTune -o -name ChitarraTuneControls \) -not -path '*dSYM*')
          [ "$found" = 1 ] || { echo "::error::no app binary found"; exit 1; }

  kit:
    name: Kit tests and coverage
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      # One tree for both steps, named (ADR 0017 rule 5). Unnamed, `swift build` writes into the
      # working tree and `coverage-gate.sh` writes into the cache, so the package was compiled twice
      # per run — and the in-tree copy was what left 211 MB under ~/Documents on a real machine.
      - name: Build without warnings
        env:
          SCRATCH: ${{ runner.temp }}/kit-build
        run: |
          swift build --package-path Packages/ChitarraTuneKit --scratch-path "$SCRATCH" --build-tests \
            -c release -Xswiftc -enable-testing -Xswiftc -warnings-as-errors
      - name: Test, with the coverage gate
        env:
          SCRATCH: ${{ runner.temp }}/kit-build
        run: Scripts/coverage-gate.sh

  # The realistic-signal accuracy matrix in full (every tuning × string × detuning × scenario). Too
  # slow for a debug build on every push, fast in an optimised one.
  dsp:
    name: DSP accuracy (full matrix)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Realistic signals, recorded corpus and real-time budgets, optimised build
        env:
          CHITARRA_FULL_DSP: "1"
        run: |
          swift test --package-path Packages/ChitarraTuneKit --scratch-path "$RUNNER_TEMP/dsp-build" \
            -c release -Xswiftc -enable-testing \
            --filter "RealisticSignalTests|RecordingCorpusTests|RealTimeBudgetTests|PitchDetectorTests"

  # The Mac app built exactly as a release and checked the way notarization and App Review would
  # (bundle, architectures, linked libraries, entitlements, no debug entitlement, symbols), plus the
  # disk image it ships in (Apple's layout, ad hoc: no certificate needed), on every push, so that
  # release day holds no surprise (ADR 0013, ADR 0014). This is also the macOS Release build check:
  # same configuration, same flags, and more assertions than a bare `xcodebuild` job would make.
  release:
    name: Release readiness · macOS (app and disk image)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Release build and notarization checks
        env:
          SCRATCH: ${{ runner.temp }}
          # The next step builds the disk image from this app, so the build outlives the check;
          # the runner is thrown away a minute later (ADR 0017 rule 3).
          KEEP_BUILD: "1"
        run: Scripts/release-check.sh
      - name: Disk image, built and verified as the release does
        env:
          SCRATCH: ${{ runner.temp }}
        run: Scripts/make-dmg.sh

  # End-to-end tests in demo mode (synthetic guitar, no microphone), including Xcode's accessibility
  # audit of every screen in light, dark, landscape and the largest text size.
  #
  # Compiling for the simulator and running on a device are separate steps: a compile error is worth
  # knowing before a simulator boots, and the generic destination is the SDK check that no other job
  # in this file now makes.
  ui-ios:
    name: UI · ${{ matrix.name }}
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # A family, never a model: Apple renames them every year (`iPhone 17 Pro` exists on the
          # Xcode 26 image and does not on the Xcode 27 one), and a job that names one breaks on an
          # image update for no reason. The step below takes whichever device of the family is there.
          - name: iPhone
            family: iPhone
          - name: iPad
            family: iPad
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available
      - name: Pick a simulator of the family
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | python3 -c "
          import json, os, sys
          family = os.environ['FAMILY']
          runtimes = json.load(sys.stdin)['devices']
          best = ()
          for runtime, devices in runtimes.items():
              if 'SimRuntime.iOS-' not in runtime:
                  continue
              version = [int(p) for p in runtime.rsplit('iOS-', 1)[1].split('-') if p.isdigit()]
              for device in devices:
                  if device['name'].startswith(family) and (not best or version > best[0]):
                      best = (version, device['udid'], device['name'])
          if not best:
              sys.exit(f'no available {family} simulator')
          print(best[1], best[2], sep='\t')
          ")"
          echo "Using ${udid#*$'\t'}"
          echo "DESTINATION=platform=iOS Simulator,id=${udid%%$'\t'*}" >> "$GITHUB_ENV"
      - name: Build the app and its tests for the simulator SDK
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project ChitarraTune.xcodeproj \
            -scheme ChitarraTune \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO
      # Serial, and measured: `-parallel-testing-enabled YES` with two workers was tried here and
      # made the job SLOWER — iPhone went from 854 s to 936 s, of which the tests alone were 867 s.
      # XCUITest distributes work by test CLASS, and all 18 tests live in one
      # (`ChitarraTuneUITests`; `AppStoreScreenshots` is skipped unless Scripts/screenshots.sh runs
      # it). One class over two workers is no concurrency at all, and a second cloned simulator is
      # booted for nothing. Splitting the class is what would have to come first — until somebody
      # does that and measures it, this stays serial.
      - name: UI tests
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project ChitarraTune.xcodeproj \
            -scheme ChitarraTune \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -skip-testing:ChitarraTuneUITests/ChitarraTuneUITests/testLaunchPerformance \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - name: Keep the result bundle when a test fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-${{ matrix.name }}
          path: ${{ runner.temp }}/ui.xcresult
          retention-days: 7

  # The Mac screens, in two halves that are worth different things.
  #
  # The build is the macOS Debug check for the whole repository and it blocks the gate. Running the
  # tests does not, TEMPORARILY: a macOS 27 minimum means the app cannot launch on the GA macos-26
  # image, and the only image that runs macOS 27 is the xcode-27 preview, whose virtual GPU has no
  # shader slice for SwiftUI's renderer ("unable to find air64_v27 slice", RenderBox): the window
  # never draws and every wait times out. Nothing there is ours to fix.
  #
  # `continue-on-error` is written as the literal `true` and not as a matrix expression. It used to
  # be `${{ matrix.allowFailure == true }}`, which never evaluated true, so the one job documented as
  # unable to stop the gate was stopping it (run 35514845091). Delete this job's second step — and
  # the note in docs/RELEASE_READINESS.md — the day a GA macos-27 image exists, and fold the Mac
  # screens back into a blocking run.
  ui-mac:
    name: UI · Mac
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: xcodebuild -version
      # The macOS test runner must be signed; an ad-hoc signature is enough on the runner.
      - name: Build the Mac app and its tests (Debug)
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project ChitarraTune.xcodeproj \
            -scheme ChitarraTune \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
      - name: UI tests on Mac (cannot stop the gate; see the note above)
        id: mac-tests
        continue-on-error: true
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project ChitarraTune.xcodeproj \
            -scheme ChitarraTune \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
      - name: Keep the result bundle when a test fails
        if: steps.mac-tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-Mac
          path: ${{ runner.temp }}/ui.xcresult
          retention-days: 7

  # One check that stands for all of the above, so the result of the whole run is a single line on
  # the commit. Add every new job to `needs` below.
  gate:
    name: Gate
    if: always()
    needs: [lint, kit, app, dsp, release, ui-ios, ui-mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every required job must have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job finished with '$result'"
              exit 1
            fi
          done
