name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 2.0.0 (the tag becomes v2.0.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false
      allow_unsigned:
        description: "Publish an unsigned, non-notarized build when no Developer ID secrets are configured"
        type: boolean
        default: false

# Read-only by default; the single job below asks for exactly what it needs.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, notarize, publish
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write # create the GitHub Release
      id-token: write # build-provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Untrusted values (tag name, dispatch input) reach the shell only through env vars and are
      # validated before use.
      - name: Resolve and validate version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          if ! [[ "$VERSION" =~ $re ]]; then
            echo "::error::'$VERSION' is not a valid semantic version"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Require a commit that is on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Releases must be cut from a commit reachable from main"
            exit 1
          fi

      - name: Test ChitarraTuneKit
        run: swift test --package-path Packages/ChitarraTuneKit

      - name: Import Developer ID certificate
        env:
          EVENT_NAME: ${{ github.event_name }}
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERT_P12:-}" ] || [ -z "${MACOS_CERT_PASSWORD:-}" ] || [ -z "${MACOS_TEAM_ID:-}" ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$ALLOW_UNSIGNED" = "true" ]; then
              echo "::warning::No Developer ID secrets: publishing an UNSIGNED, non-notarized build"
              echo "SIGNED=false" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::MACOS_CERT_P12, MACOS_CERT_PASSWORD and MACOS_TEAM_ID are required to publish a release"
            exit 1
          fi
          umask 077
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASS"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certificate.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' | head -n 1)"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in the imported certificate"
            exit 1
          fi
          {
            echo "SIGNED=true"
            echo "KEYCHAIN=$KEYCHAIN"
            echo "IDENTITY=$IDENTITY"
          } >> "$GITHUB_ENV"

      # Signing happens inside xcodebuild so Xcode embeds the complete entitlement set (the sandbox
      # and audio-input entitlements come from build settings, not from Config/*.entitlements).
      - name: Build Release
        env:
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          COMMON=(
            -project ChitarraTune.xcodeproj
            -scheme ChitarraTune
            -configuration Release
            -destination 'platform=macOS'
            -derivedDataPath build
            MARKETING_VERSION="$VERSION"
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
            GIT_COMMIT="$(git rev-parse --short HEAD)"
          )
          if [ "$SIGNED" = "true" ]; then
            xcodebuild "${COMMON[@]}" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="$IDENTITY" \
              DEVELOPMENT_TEAM="$MACOS_TEAM_ID" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              OTHER_CODE_SIGN_FLAGS="--timestamp --keychain $KEYCHAIN" \
              ENABLE_HARDENED_RUNTIME=YES \
              build
          else
            xcodebuild "${COMMON[@]}" CODE_SIGNING_ALLOWED=NO build
          fi
          test -d build/Build/Products/Release/ChitarraTune.app

      - name: Verify signature, hardened runtime and entitlements
        if: env.SIGNED == 'true'
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/ChitarraTune.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -Eq 'flags=.*runtime' \
            || { echo "::error::Hardened Runtime is not enabled"; exit 1; }
          ENTITLEMENTS="$(codesign -d --entitlements :- "$APP" 2>/dev/null)"
          for key in com.apple.security.app-sandbox com.apple.security.device.audio-input; do
            grep -q "<key>$key</key>" <<< "$ENTITLEMENTS" \
              || { echo "::error::Signed app is missing the $key entitlement"; exit 1; }
          done

      - name: Notarize and staple
        if: env.SIGNED == 'true'
        env:
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "${NOTARY_API_KEY_ID:-}" ] || [ -z "${NOTARY_API_ISSUER_ID:-}" ] || [ -z "${NOTARY_API_KEY_P8:-}" ]; then
            echo "::warning::Notary API secrets not configured: the release is signed but NOT notarized"
            exit 0
          fi
          umask 077
          APP="build/Build/Products/Release/ChitarraTune.app"
          echo "$NOTARY_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          RESULT="$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_API_KEY_ID" \
            --issuer "$NOTARY_API_ISSUER_ID" \
            --wait --timeout 30m --output-format json)"
          echo "$RESULT"
          grep -Eq '"status" *: *"Accepted"' <<< "$RESULT" \
            || { echo "::error::Notarization was not accepted"; exit 1; }
          xcrun stapler staple -v "$APP"
          xcrun stapler validate -v "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

      - name: Package
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/ChitarraTune.app"
          ZIP="ChitarraTune-${VERSION}-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ env.ZIP }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          ARGS=(--title "ChitarraTune $VERSION" --generate-notes --target "$GITHUB_SHA")
          if [ "$PRERELEASE" = "true" ] || [[ "$VERSION" == *-* ]]; then ARGS+=(--prerelease); fi
          if [ "$SIGNED" != "true" ]; then
            ARGS+=(--notes "> **Unsigned build.** macOS Gatekeeper will warn about it. Verify the checksum, then use Right-click → Open once.")
          fi
          gh release create "$TAG" "$ZIP" "$ZIP.sha256" "${ARGS[@]}"

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/notarize.zip"
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
