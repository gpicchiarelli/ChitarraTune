name: SwiftLint

# No path filters: this check is required by branch protection, so it must run on every change.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: swiftlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    # SwiftLint only parses source, so the (much cheaper) Linux image is enough.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/realm/swiftlint:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: SwiftLint in strict mode (warnings fail the build)
        run: swiftlint lint --strict --reporter github-actions-logging
