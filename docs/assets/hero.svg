<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 604 830" width="604" height="830" role="img" aria-labelledby="title desc">
<title id="title">ChitarraTune</title>
<desc id="desc">The tuner reading the low E string at 82.4 hertz, two cents sharp and in tune, with standard tuning selected and the six strings listed below the dial.</desc>
<!-- Drawn from the app rather than around it. The dial is TunerDial: fifty cents each side of centre
     over sixty-two degrees, a plain track with the in-tune zone of
     EngineParameters.standard.inTuneThreshold laid over it, ticks every five cents, the needle
     pivoting at the foot. The order down the card is TunerScreen's: the note, the gauge, the level,
     the controls, the button. The field is TunerBackground, a faint radial wash of the state's own
     colour. The colours are the dark-appearance values in App/Resources/Assets.xcassets. -->
<defs>
<linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#15151D"/><stop offset="1" stop-color="#0A0A0F"/></linearGradient>
<radialGradient id="wash" cx="280" cy="172" r="520" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3DDC84" stop-opacity=".14"/><stop offset="1" stop-color="#3DDC84" stop-opacity="0"/></radialGradient>
<radialGradient id="cast" cx=".5" cy=".5" r=".5"><stop offset=".55" stop-color="#0A0A0F" stop-opacity=".22"/><stop offset="1" stop-color="#0A0A0F" stop-opacity="0"/></radialGradient>
<clipPath id="card"><rect width="560" height="780" rx="34"/></clipPath>
</defs>
<ellipse cx="302" cy="806" rx="246" ry="26" fill="url(#cast)"/>
<g transform="translate(22 16)">
<g clip-path="url(#card)">
<rect width="560" height="780" fill="url(#field)"/>
<rect width="560" height="780" fill="url(#wash)"/>
