# SwiftLint configuration for ChitarraTune
# https://github.com/realm/SwiftLint

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - modifier_order
  - redundant_nil_coalescing
  - sorted_first_last

disabled_rules:
  - trailing_whitespace
  - line_length

excluded:
  - Apps/Shared/Generated
  - ChitarraTune.xcodeproj
  - .build
  - DerivedData
  - build

reporter: "xcode"
